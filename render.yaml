services:
  - type: web
    name: meu-pdi-kauan
    runtime: python
    plan: free
    buildCommand: bash scripts/build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /health/ready/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: meu-pdi-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: PUBLIC_DEMO_MODE
        value: "false"
      - key: PDI_REQUIRE_LOGIN
        value: "true"
      - key: PDI_ADMIN_NAME
        value: Kauan Bulgaroni
      - key: PDI_ADMIN_EMAIL
        sync: false
      - key: PDI_ADMIN_PASSWORD
        sync: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: APP_ENVIRONMENT
        value: production

databases:
  - name: meu-pdi-db
    plan: free
    databaseName: meu_pdi
    user: meu_pdi_app
